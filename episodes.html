<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episodes — KATARUNGAN UNIVERSE</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&display=swap');

    :root {
        --gold:    #b8860b;
        --gold-lt: #d4a017;
        --red:     #8b0000;
        --red-lt:  #cc0000;
        --dark:    #0a0a0a;
        --dark2:   #111;
        --dark3:   #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Cinzel', serif;
        background: var(--dark);
        color: #ccc;
        overflow-x: hidden;
    }

    /* ===== NAV (shared) ===== */
    nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        height: 64px;
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(184,134,11,0.4);
    }

    .nav-brand {
        font-family: 'Cinzel Decorative', serif;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 2px;
        background: linear-gradient(180deg, #fff 0%, #d4d4d4 30%, #a8a8a8 60%, #c0c0c0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 8px;
        list-style: none;
    }

    .nav-links a {
        color: #aaa;
        text-decoration: none;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid transparent;
        transition: all 0.3s;
    }

    .nav-links a:hover,
    .nav-links a.active {
        color: var(--gold-lt);
        border-color: rgba(184,134,11,0.5);
        background: rgba(184,134,11,0.08);
    }

    .nav-links a.active { color: #fff; border-color: var(--gold); }

    /* ===== PAGE HEADER ===== */
    .page-header {
        padding-top: 64px;
        position: relative;
        text-align: center;
        padding-bottom: 60px;
        overflow: hidden;
    }

    .page-header::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('https://i.imgur.com/fAG6su8.png');
        background-size: cover;
        background-position: center top;
        opacity: 0.18;
    }

    .page-header-inner {
        position: relative;
        z-index: 1;
        padding: 60px 20px 20px;
    }

    .page-eyebrow {
        font-size: 0.65rem;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 14px;
        display: block;
    }

    .page-title {
        font-family: 'Cinzel Decorative', serif;
        font-size: clamp(1.6rem, 5vw, 3rem);
        font-weight: 900;
        letter-spacing: 3px;
        background: linear-gradient(180deg, #fff 0%, #d0d0d0 40%, #888 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }

    .page-divider {
        width: 80px;
        height: 1px;
        background: linear-gradient(to right, transparent, var(--gold), transparent);
        margin: 20px auto 0;
    }

    /* ===== FEATURED PLAYER ===== */
    .featured {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px 60px;
    }

    .featured-label {
        font-size: 0.6rem;
        letter-spacing: 4px;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 12px;
        display: block;
    }

    .featured-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: #eee;
        margin-bottom: 16px;
        letter-spacing: 1px;
    }

    .video-frame {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%; /* 16:9 */
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(184,134,11,0.3);
        box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(184,134,11,0.1);
    }

    .video-frame iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
    }

    /* ===== EPISODE GRID ===== */
    .episodes-section {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px 80px;
    }

    .section-label {
        font-size: 0.6rem;
        letter-spacing: 5px;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(184,134,11,0.2);
        display: block;
    }

    .episode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
    }

    .ep-card {
        background: var(--dark3);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        cursor: pointer;
    }

    .ep-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        border-color: rgba(184,134,11,0.35);
    }

    /* Thumbnail wrapper with play button overlay */
    .ep-thumb {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        background: #000;
        overflow: hidden;
    }

    .ep-thumb iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
        pointer-events: none; /* clicks go to the card, not iframe */
    }

    .ep-thumb-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.35);
        transition: background 0.3s;
    }

    .ep-card:hover .ep-thumb-overlay { background: rgba(0,0,0,0.1); }

    .play-btn {
        width: 52px; height: 52px;
        background: rgba(255,255,255,0.9);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s, background 0.3s;
    }

    .ep-card:hover .play-btn {
        transform: scale(1.1);
        background: #fff;
    }

    .play-btn::after {
        content: '';
        width: 0; height: 0;
        border-style: solid;
        border-width: 9px 0 9px 18px;
        border-color: transparent transparent transparent #000;
        margin-left: 4px;
    }

    .ep-info {
        padding: 16px 18px 20px;
    }

    .ep-number {
        font-size: 0.58rem;
        letter-spacing: 3px;
        color: var(--gold);
        text-transform: uppercase;
        margin-bottom: 6px;
        display: block;
    }

    .ep-title {
        font-size: 0.92rem;
        font-weight: 600;
        color: #ddd;
        letter-spacing: 0.5px;
        line-height: 1.4;
        margin-bottom: 8px;
    }

    .ep-desc {
        font-size: 0.72rem;
        color: rgba(255,255,255,0.35);
        line-height: 1.7;
        letter-spacing: 0.5px;
    }

    /* Modal player */
    #epModal {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(0,0,0,0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        padding: 20px;
    }

    #epModal.open { opacity: 1; pointer-events: all; }

    .modal-inner {
        width: 100%;
        max-width: 860px;
        position: relative;
    }

    .modal-close {
        position: absolute;
        top: -44px; right: 0;
        background: rgba(255,0,0,0.7);
        border: none;
        color: white;
        font-size: 1.2rem;
        width: 36px; height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        font-family: sans-serif;
        padding: 0;
        margin: 0;
    }

    .modal-close:hover { background: red; }

    .modal-video {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(184,134,11,0.4);
    }

    .modal-video iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
    }

    /* ===== FOOTER ===== */
    footer {
        text-align: center;
        padding: 32px;
        font-size: 0.65rem;
        letter-spacing: 2px;
        color: rgba(255,255,255,0.2);
        border-top: 1px solid rgba(255,255,255,0.06);
        text-transform: uppercase;
    }

    @media (max-width: 600px) {
        nav { padding: 0 16px; }
        .nav-brand { font-size: 0.75rem; }
        .nav-links a { padding: 6px 10px; font-size: 0.68rem; }
        .episode-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<!-- ===== NAV ===== -->
<nav>
    <a href="index.html" class="nav-brand">KU</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="merch.html">Merch</a></li>
        <li><a href="episodes.html" class="active">Episodes</a></li>
    </ul>
</nav>

<!-- ===== PAGE HEADER ===== -->
<div class="page-header">
    <div class="page-header-inner">
        <span class="page-eyebrow">Watch Now</span>
        <h1 class="page-title">Episodes</h1>
        <div class="page-divider"></div>
    </div>
</div>

<!-- ===== FEATURED VIDEO ===== -->
<div class="featured">
    <span class="featured-label">⭐ Featured Episode</span>
    <div class="video-frame">
        <!--
        🔴 REPLACE THE src BELOW WITH YOUR YOUTUBE EMBED LINK
        How to get embed link:
        1. Go to your YouTube video
        2. Click Share → Embed
        3. Copy only the URL inside src="..." — looks like:
           https://www.youtube.com/embed/VIDEO_ID_HERE
        -->
        <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_HERE"
            title="Featured Episode"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
</div>

<!-- ===== EPISODE GRID ===== -->
<div class="episodes-section">
    <span class="section-label">All Episodes</span>
    <div class="episode-grid" id="episodeGrid"></div>
</div>

<!-- ===== MODAL PLAYER ===== -->
<div id="epModal" onclick="closeModal(event)">
    <div class="modal-inner">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-video">
            <iframe id="modalIframe" src="" title="Episode Player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>
</div>

<!-- ===== FOOTER ===== -->
<footer>
    &copy; 2025 Katarungan Universe &nbsp;·&nbsp; All Rights Reserved
</footer>

<script>

/* ===============================
   🎬 EPISODE DATABASE
   👉 ADD YOUR EPISODES HERE

   HOW TO GET THE YOUTUBE EMBED ID:
   - Open your YouTube video
   - The URL looks like: youtube.com/watch?v=ABC123xyz
   - Copy only the part after v= → that is your videoId
   - Example: videoId: "ABC123xyz"
================================ */

const episodes = [

    {
        episode:  "Episode 1",
        title:    "Ang Simula",                       // 🔴 Replace with your episode title
        desc:     "The story begins. Justice awakens in the shadows.",  // 🔴 Replace with description
        videoId:  "VIDEO_ID_HERE"                     // 🔴 Replace with your YouTube video ID
    },

    {
        episode:  "Episode 2",
        title:    "Ang Lihim",
        desc:     "Secrets buried in darkness begin to surface.",
        videoId:  "VIDEO_ID_HERE"
    },

    {
        episode:  "Episode 3",
        title:    "Ang Pagbabago",
        desc:     "Nothing is what it seems. Transformation is inevitable.",
        videoId:  "VIDEO_ID_HERE"
    }

    /*
    🆕 ADD MORE EPISODES LIKE THIS (don't forget the comma!):

    ,{
        episode:  "Episode 4",
        title:    "Your Title Here",
        desc:     "Short description of the episode.",
        videoId:  "VIDEO_ID_HERE"
    }
    */

];

/* ================= BUILD EPISODE CARDS ================= */

function buildEpisodes() {
    const grid = document.getElementById("episodeGrid");
    grid.innerHTML = "";

    episodes.forEach(function(ep) {
        const card = document.createElement("div");
        card.className = "ep-card";
        card.onclick = function() { openModal(ep.videoId); };

        card.innerHTML =
            "<div class='ep-thumb'>" +
                "<iframe src='https://www.youtube.com/embed/" + ep.videoId + "?mute=1' " +
                    "title='" + ep.title + "' tabindex='-1'></iframe>" +
                "<div class='ep-thumb-overlay'>" +
                    "<div class='play-btn'></div>" +
                "</div>" +
            "</div>" +
            "<div class='ep-info'>" +
                "<span class='ep-number'>" + ep.episode + "</span>" +
                "<div class='ep-title'>" + ep.title + "</div>" +
                "<div class='ep-desc'>" + ep.desc + "</div>" +
            "</div>";

        grid.appendChild(card);
    });
}

/* ================= MODAL PLAYER ================= */

function openModal(videoId) {
    document.getElementById("modalIframe").src =
        "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
    document.getElementById("epModal").classList.add("open");
    document.body.style.overflow = "hidden";
}

function closeModal(event) {
    if (event && event.target === document.getElementById("modalIframe")) return;
    if (event && event.target.closest(".modal-inner") &&
        !event.target.classList.contains("modal-close")) return;
    document.getElementById("modalIframe").src = "";
    document.getElementById("epModal").classList.remove("open");
    document.body.style.overflow = "";
}

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") closeModal();
});

/* ================= INIT ================= */
buildEpisodes();

</script>
</body>
</html>
