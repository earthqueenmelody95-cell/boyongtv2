<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episodes — KATARUNGAN UNIVERSE</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600&display=swap');

    :root {
        --gold:    #b8860b;
        --gold-lt: #d4a017;
        --dark:    #0a0a0a;
        --dark3:   #1a1a1a;
        --nav-h:   60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cinzel', serif; background: var(--dark); color: #ccc; overflow-x: hidden; }

    /* ===== NAV ===== */
    nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 200;
        height: var(--nav-h);
        background: rgba(0,0,0,0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(184,134,11,0.4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
    }

    .nav-brand {
        font-family: 'Cinzel Decorative', serif;
        font-size: 1rem; font-weight: 900; letter-spacing: 2px;
        background: linear-gradient(180deg,#fff 0%,#d4d4d4 30%,#a8a8a8 60%,#c0c0c0 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        text-decoration: none; flex-shrink: 0;
    }

    .nav-links { display: flex; gap: 4px; list-style: none; }

    .nav-links a {
        color: #aaa; text-decoration: none;
        font-size: 0.72rem; font-weight: 600;
        letter-spacing: 2px; text-transform: uppercase;
        padding: 9px 14px; min-height: 44px;
        display: flex; align-items: center;
        border-radius: 4px; border: 1px solid transparent;
        transition: all 0.3s; white-space: nowrap;
    }

    .nav-links a:hover { color: var(--gold-lt); border-color: rgba(184,134,11,0.5); background: rgba(184,134,11,0.08); }
    .nav-links a.active { color: #fff; border-color: var(--gold); background: rgba(184,134,11,0.08); }

    .nav-hamburger {
        display: none; flex-direction: column;
        justify-content: center; gap: 5px;
        width: 44px; height: 44px;
        cursor: pointer; background: none;
        border: none; padding: 8px; border-radius: 6px;
        transition: background 0.2s; flex-shrink: 0;
    }

    .nav-hamburger:hover { background: rgba(255,255,255,0.07); }

    .nav-hamburger span {
        display: block; width: 22px; height: 2px;
        background: #ccc; border-radius: 2px;
        transition: all 0.3s; transform-origin: center;
    }

    .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-mobile {
        display: none; position: fixed;
        top: var(--nav-h); left: 0; right: 0;
        background: rgba(0,0,0,0.97);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(184,134,11,0.3);
        z-index: 199; flex-direction: column;
        padding: 12px 16px 20px; gap: 4px;
        transform: translateY(-20px); opacity: 0;
        pointer-events: none; transition: all 0.3s ease;
    }

    .nav-mobile.open { opacity: 1; transform: translateY(0); pointer-events: all; }

    .nav-mobile a {
        color: #bbb; text-decoration: none;
        font-size: 0.85rem; font-weight: 600;
        letter-spacing: 2px; text-transform: uppercase;
        padding: 14px 16px; border-radius: 6px;
        border: 1px solid transparent; min-height: 52px;
        display: flex; align-items: center; transition: all 0.2s;
    }

    .nav-mobile a:hover { background: rgba(184,134,11,0.1); border-color: rgba(184,134,11,0.3); color: var(--gold-lt); }
    .nav-mobile a.active { color: #fff; border-color: var(--gold); background: rgba(184,134,11,0.08); }

    @media (max-width: 640px) {
        .nav-links { display: none; }
        .nav-hamburger { display: flex; }
        .nav-mobile { display: flex; }
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
        padding-top: var(--nav-h);
        position: relative;
        text-align: center;
        overflow: hidden;
    }

    .page-header::before {
        content: '';
        position: absolute; inset: 0;
        background-image: url('https://i.imgur.com/fAG6su8.png');
        background-size: cover; background-position: center top;
        opacity: 0.18;
    }

    .page-header-inner {
        position: relative; z-index: 1;
        padding: 50px 20px 40px;
    }

    .page-eyebrow {
        font-size: 0.62rem; letter-spacing: 5px;
        text-transform: uppercase; color: var(--gold);
        margin-bottom: 12px; display: block;
    }

    .page-title {
        font-family: 'Cinzel Decorative', serif;
        font-size: clamp(1.6rem, 6vw, 3rem);
        font-weight: 900; letter-spacing: 3px;
        background: linear-gradient(180deg,#fff 0%,#d0d0d0 40%,#888 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
    }

    .page-divider {
        width: 80px; height: 1px;
        background: linear-gradient(to right, transparent, var(--gold), transparent);
        margin: 18px auto 0;
    }

    /* ===== FEATURED ===== */
    .featured {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 16px 48px;
    }

    .featured-label {
        font-size: 0.58rem; letter-spacing: 4px;
        color: var(--gold); text-transform: uppercase;
        margin-bottom: 12px; display: block;
    }

    .video-frame {
        position: relative; width: 100%;
        padding-bottom: 56.25%;
        background: #000; border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(184,134,11,0.3);
        box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .video-frame iframe {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; border: none;
    }

    /* ===== EPISODE GRID ===== */
    .episodes-section {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px 60px;
    }

    .section-label {
        font-size: 0.58rem; letter-spacing: 5px;
        color: var(--gold); text-transform: uppercase;
        margin-bottom: 20px; padding-bottom: 12px;
        border-bottom: 1px solid rgba(184,134,11,0.2);
        display: block;
    }

    .episode-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }

    .ep-card {
        background: var(--dark3); border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
        transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) {
        .ep-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.5); border-color: rgba(184,134,11,0.35); }
    }

    .ep-card:active { transform: scale(0.98); }

    .ep-thumb {
        position: relative; width: 100%;
        padding-bottom: 56.25%;
        background: #000; overflow: hidden;
    }

    .ep-thumb iframe {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; border: none;
        pointer-events: none;
    }

    .ep-thumb-overlay {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.35); transition: background 0.3s;
    }

    .ep-card:hover .ep-thumb-overlay { background: rgba(0,0,0,0.1); }

    .play-btn {
        width: 54px; height: 54px;
        background: rgba(255,255,255,0.92);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        transition: transform 0.3s, background 0.3s;
    }

    .ep-card:hover .play-btn { transform: scale(1.1); background: #fff; }

    .play-btn::after {
        content: '';
        width: 0; height: 0;
        border-style: solid;
        border-width: 9px 0 9px 18px;
        border-color: transparent transparent transparent #000;
        margin-left: 4px;
    }

    .ep-info { padding: 14px 16px 18px; }

    .ep-number {
        font-size: 0.56rem; letter-spacing: 3px;
        color: var(--gold); text-transform: uppercase;
        margin-bottom: 5px; display: block;
    }

    .ep-title {
        font-size: clamp(0.82rem, 2.5vw, 0.92rem);
        font-weight: 600; color: #ddd;
        letter-spacing: 0.5px; line-height: 1.4; margin-bottom: 6px;
    }

    .ep-desc {
        font-size: clamp(0.68rem, 2vw, 0.72rem);
        color: rgba(255,255,255,0.35);
        line-height: 1.7; letter-spacing: 0.5px;
    }

    /* ===== MODAL ===== */
    #epModal {
        position: fixed; inset: 0;
        z-index: 500;
        background: rgba(0,0,0,0.96);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s;
        padding: 16px;
    }

    #epModal.open { opacity: 1; pointer-events: all; }

    .modal-inner {
        width: 100%; max-width: 860px;
        position: relative;
    }

    .modal-close {
        position: absolute;
        top: -48px; right: 0;
        background: rgba(255,0,0,0.8);
        border: none; color: white;
        font-size: 1.1rem;
        width: 44px; height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s;
        font-family: sans-serif;
        padding: 0; margin: 0;
        -webkit-tap-highlight-color: transparent;
    }

    .modal-close:hover,.modal-close:active { background: red; }

    .modal-video {
        position: relative; width: 100%;
        padding-bottom: 56.25%;
        background: #000; border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(184,134,11,0.4);
    }

    .modal-video iframe {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; border: none;
    }

    /* ===== FOOTER ===== */
    footer {
        text-align: center; padding: 28px 20px;
        font-size: 0.62rem; letter-spacing: 2px;
        color: rgba(255,255,255,0.2);
        border-top: 1px solid rgba(255,255,255,0.06);
        text-transform: uppercase;
    }

    @media (max-width: 480px) {
        .episode-grid { grid-template-columns: 1fr; }
        .featured { padding: 24px 12px 36px; }
        .episodes-section { padding: 0 12px 48px; }
    }
</style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-brand">KU</a>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="merch.html">Merch</a></li>
        <li><a href="episodes.html" class="active">Episodes</a></li>
        <li><a href="support.html">Support Us</a></li>
    </ul>
    <button class="nav-hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
    </button>
</nav>

<div class="nav-mobile" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="merch.html">Merch</a>
    <a href="episodes.html" class="active">Episodes</a>
    <a href="support.html">Support Us</a>
</div>

<div class="page-header">
    <div class="page-header-inner">
        <span class="page-eyebrow">Watch Now</span>
        <h1 class="page-title">Episodes</h1>
        <div class="page-divider"></div>
    </div>
</div>

<div class="featured">
    <span class="featured-label">⭐ Featured Episode</span>
    <div class="video-frame">
        <!-- 🔴 REPLACE VIDEO_ID_HERE with your YouTube video ID -->
        <iframe src="https://www.youtube.com/embed/ovtXRhtWzWY"
            title="Featured Episode"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
    </div>
</div>

<div class="episodes-section">
    <span class="section-label">All Episodes</span>
    <div class="episode-grid" id="episodeGrid"></div>
</div>

<div id="epModal" onclick="closeModal(event)">
    <div class="modal-inner">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-video">
            <iframe id="modalIframe" src="" title="Episode Player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
        </div>
    </div>
</div>

<footer>&copy; 2025 Katarungan Universe &nbsp;·&nbsp; All Rights Reserved</footer>

<script>
/* ===============================
   🎬 EPISODE DATABASE
   HOW TO GET YOUR VIDEO ID:
   youtube.com/watch?v=ABC123  →  videoId: "ABC123"
================================ */

const episodes = [
    {
        episode: "Episode 1",
        title:   "Ang Simula",
        desc:    "The story begins. Justice awakens in the shadows.",
        videoId: "ovtXRhtWzWY"
    },
    {
        episode: "Episode 2",
        title:   "Ang Lihim",
        desc:    "Secrets buried in darkness begin to surface.",
        videoId: "VIDEO_ID_HERE"   // 🔴 Replace
    },
    {
        episode: "Episode 3",
        title:   "Ang Pagbabago",
        desc:    "Nothing is what it seems. Transformation is inevitable.",
        videoId: "VIDEO_ID_HERE"   // 🔴 Replace
    }
    /*
    🆕 ADD MORE (comma before {):
    ,{
        episode: "Episode 4",
        title:   "Your Title",
        desc:    "Description here.",
        videoId: "VIDEO_ID_HERE"
    }
    */
];

function buildEpisodes() {
    const grid = document.getElementById('episodeGrid');
    grid.innerHTML = '';
    episodes.forEach(function(ep) {
        const card = document.createElement('div');
        card.className = 'ep-card';
        card.onclick = function() { openModal(ep.videoId); };
        card.innerHTML =
            "<div class='ep-thumb'>" +
                "<iframe src='https://www.youtube.com/embed/" + ep.videoId + "?mute=1' title='" + ep.title + "' tabindex='-1'></iframe>" +
                "<div class='ep-thumb-overlay'><div class='play-btn'></div></div>" +
            "</div>" +
            "<div class='ep-info'>" +
                "<span class='ep-number'>" + ep.episode + "</span>" +
                "<div class='ep-title'>" + ep.title + "</div>" +
                "<div class='ep-desc'>" + ep.desc + "</div>" +
            "</div>";
        grid.appendChild(card);
    });
}

function openModal(videoId) {
    document.getElementById('modalIframe').src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1';
    document.getElementById('epModal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeModal(event) {
    if (event && event.target === document.getElementById('modalIframe')) return;
    if (event && event.target.closest && event.target.closest('.modal-inner') && !event.target.classList.contains('modal-close')) return;
    document.getElementById('modalIframe').src = '';
    document.getElementById('epModal').classList.remove('open');
    document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// Hamburger
const hamburger = document.getElementById('hamburger');
const mobileNav = document.getElementById('mobileNav');
hamburger.addEventListener('click', function() {
    hamburger.classList.toggle('open');
    mobileNav.classList.toggle('open');
});
mobileNav.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
        hamburger.classList.remove('open');
        mobileNav.classList.remove('open');
    });
});

buildEpisodes();
</script>
</body>
</html>
